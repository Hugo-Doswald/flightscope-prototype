[package]
name = "flightscope"
version = "0.2.0"
description = "FlightScope aircraft tracking prototype"
authors = ["CAF4U"]
edition = "2021"

[lib]
name = "flightscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
